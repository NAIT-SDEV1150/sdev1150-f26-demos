<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Day 14 – catch the button</title>
  <link rel="stylesheet" href="styles.css">
  <script src="main.js" defer></script>
</head>
<body>
  <h1>Catch the button</h1>
  <p>Try to click it. Every time your mouse touches a button, it hides and its twin appears somewhere else.</p>

  <div id="play-area">
    <button id="btn-a" class="catch-btn">Click me a!</button>
    <button id="btn-b" class="catch-btn hidden">Click me b!</button>
  </div>
  <p id="message"></p>
</body>
</html>
