<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Day 14 – show and hide</title>
  <link rel="stylesheet" href="styles.css">
  <script src="main.js" defer></script>
</head>
<body>
  <h1>Show and hide</h1>

  <h2>1. A button that turns a panel on and off</h2>
  <button id="toggle-btn">Show details</button>
  <div id="details" class="panel hidden">
    <p>Surprise! This panel was here all along. It just had <code>display: none</code>.</p>
  </div>

  <h2>2. Hover to peek</h2>
  <div id="peek" class="peek">
    <p class="answer">The answer is 42.</p>
    <div class="cover">Hover to see the answer</div>
  </div>
</body>
</html>
