<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Day 14 – tic-tac-toe</title>
  <link rel="stylesheet" href="styles.css">
  <script src="main.js" defer></script>
</head>
<body>
  <h1>Tic-tac-toe</h1>
  <p id="status">X's turn</p>

  <!-- Every cell already holds an X and an O. Both start hidden. -->
  <div id="board">
    <div class="cell"><span class="x hidden">X</span><span class="o hidden">O</span></div>
    <div class="cell"><span class="x hidden">X</span><span class="o hidden">O</span></div>
    <div class="cell"><span class="x hidden">X</span><span class="o hidden">O</span></div>
    <div class="cell"><span class="x hidden">X</span><span class="o hidden">O</span></div>
    <div class="cell"><span class="x hidden">X</span><span class="o hidden">O</span></div>
    <div class="cell"><span class="x hidden">X</span><span class="o hidden">O</span></div>
    <div class="cell"><span class="x hidden">X</span><span class="o hidden">O</span></div>
    <div class="cell"><span class="x hidden">X</span><span class="o hidden">O</span></div>
    <div class="cell"><span class="x hidden">X</span><span class="o hidden">O</span></div>
  </div>

  <button id="reset-btn">New game</button>
</body>
</html>
