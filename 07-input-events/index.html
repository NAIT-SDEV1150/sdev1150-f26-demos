<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Input events</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; }
    label { display: block; margin-top: 1rem; font-weight: 600; }
    input, select { padding: .4rem; font-size: 1rem; }
    #log { background: #0f172a; color: #e2e8f0; padding: .75rem; border-radius: 8px; height: 220px; overflow-y: auto; font-family: monospace; font-size: .9rem; }
    .focused { outline: 3px solid #2563eb; }
  </style>
  <script src="main.js" defer></script>
</head>
<body>
  <h1>Input events: watch them fire</h1>
  <p>Type, click and tab around. Every event shows up in the log.</p>

  <label for="name">Name (input, focus, blur)</label>
  <input id="name" type="text" placeholder="Type here">
  <p>Live preview: <strong id="preview"></strong></p>

  <label for="colour">Favourite colour (change)</label>
  <select id="colour">
    <option value="">Pick one</option>
    <option>red</option><option>green</option><option>blue</option>
  </select>

  <label><input id="agree" type="checkbox"> I agree (change + checked)</label>

  <label for="search">Search (keydown: press Enter)</label>
  <input id="search" type="text" placeholder="Press Enter to search">

  <h2>Event log</h2>
  <div id="log"></div>
</body>
</html>
