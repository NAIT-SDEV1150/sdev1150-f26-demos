<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Rules in functions</title><script src="main.js" defer></script></head>
<body>
  <h1>Sign in</h1>
  <form id="login-form">
    <p>
      <label for="username">Username</label>
      <input id="username" type="text">
    </p>
    <p>
      <label for="password">Password</label>
      <input id="password" type="password">
    </p>
    <button type="submit">Sign in</button>
  </form>
  <p id="message"></p>
  <p><small>Try: student1 / Secret123</small></p>
</body>
</html>
